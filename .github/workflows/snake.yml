name: Generate contribution snake

# Optional. Builds two snake SVGs recolored to the profile palette and pushes
# them to a branch called `output`. The README references them from there.
#
# First run: Actions tab > "Generate contribution snake" > Run workflow.
# After that it refreshes itself once a day.

on:
  schedule:
    - cron: "17 3 * * *" # daily, off the top of the hour to dodge queue spikes
  workflow_dispatch:

permissions:
  contents: write # needed to push the `output` branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Colors: dots go from "no contributions" (first) to "most" (last).
      # Exactly 5 are required. Dark = lime on obsidian, light = olive on ivory.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#F0EEE6&color_dots=#1C1C22,#33401A,#5A7A1C,#93C428,#C6FF3D
            dist/github-snake-light.svg?color_snake=#101014&color_dots=#E7E4D9,#DDF59B,#C6FF3D,#8DB81F,#4F6B0C
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
